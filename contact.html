    <link rel="icon" type="image/png" href="logo2.png">
    <link rel="canonical" href="https://mohamyiq.com/contact.html">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --bg-dark: #0a0f2b; 
            --gold-main: #f9d77a; 
            --gold-dark: #b8955a;
            --glass-bg: rgba(255, 255, 255, 0.03); 
            --glass-border: rgba(249, 215, 122, 0.15); 
        }
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Cairo', sans-serif; 
        }
        body { 
            background-color: var(--bg-dark); 
            color: #e2e8f0; 
            min-height: 100vh;
        }
        nav { 
            padding: 20px 8%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 15px; 
            border-bottom: 1px solid var(--glass-border); 
            background: rgba(10, 15, 43, 0.95); 
        }
        .logo-img { height: 70px; }
        .nav-links { display: flex; flex-wrap: wrap; gap: 20px; }
        .nav-links a { color: #fff; text-decoration: none; font-weight: 600; font-size: 0.95rem; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold-main); }
        .page-wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px 80px; }
        .contact-card { 
            background: var(--glass-bg); 
            border: 1px solid var(--glass-border); 
            padding: 50px 40px; 
            border-radius: 30px; 
            backdrop-filter: blur(20px); 
            text-align: center; 
            width: 100%; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        h1 { 
            color: var(--gold-main); 
            margin-bottom: 15px; 
            font-weight: 900; 
            font-size: 2.2rem;
        }
        p.intro { 
            margin-bottom: 35px; 
            color: #94a3b8; 
            font-size: 1.05rem;
        }
        .contact-methods { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 20px; 
        }
        .method { 
            padding: 24px 12px; 
            background: rgba(255,255,255,0.05); 
            border-radius: 20px; 
            text-decoration: none; 
            color: white; 
            border: 1px solid transparent; 
            transition: 0.3s ease; 
            font-weight: 700; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            gap: 12px;
            text-align: center;
        }
        .method i {
            font-size: 3rem;
            transition: transform 0.2s;
        }
        .method span {
            font-size: 0.95rem;
            color: #cbd5e1;
            transition: 0.3s ease;
            font-weight: 600;
        }
        .method:hover i {
            transform: scale(1.05);
        }
        .method:hover span {
            color: var(--gold-main);
        }
        .method:hover { 
            border-color: var(--gold-main); 
            background: rgba(249, 215, 122, 0.1); 
            transform: translateY(-3px);
        }
        .btn-back { 
            display: inline-block; 
            margin-top: 35px; 
            color: var(--gold-main); 
            text-decoration: none; 
            font-weight: 700; 
            border: 1px solid var(--gold-main); 
            padding: 10px 30px; 
            border-radius: 50px; 
            transition: 0.3s;
        }
        .btn-back:hover {
            background: var(--gold-main);
            color: var(--bg-dark);
        }
        @media (max-width: 600px) {
            .contact-card { padding: 30px 20px; }
            .contact-card h1 { font-size: 1.8rem; }
            nav { justify-content: center; }
            .nav-links { justify-content: center; }
            .contact-methods { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .method { padding: 18px 8px; }
            .method i { font-size: 2.3rem; }
            .method span { font-size: 0.85rem; }
        }
        @media (max-width: 400px) {
            .contact-methods { grid-template-columns: 1fr; }
        }
    </style>
</head>
